<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07070a"><link rel="icon" href="/nico.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/ui.css"><title>Spieler-Bereich | NICO GAMING</title></head>
<body><main class="wrap">
<form id="login" class="login"><h1><img src="/nico.png" alt="">Spieler-Login</h1>
<div><label for="user">Benutzername</label><input id="user" autocomplete="username" autocapitalize="none" required></div>
<div><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Anmelden</button><p class="err" id="lerr" role="alert"></p>
<p class="hint">Deine Zugangsdaten bekommst du von N1CO. <a href="/" style="text-decoration:underline">Zur Website</a></p></form>

<div id="panel" hidden>
<div class="bar"><h1 id="hello"></h1><button class="btn ghost sm" id="reload" type="button">Neu laden</button><button class="btn ghost sm" id="logout" type="button">Abmelden</button></div>
<div class="card me"><div id="avwrap"></div><div class="stack"><div class="chips"><button class="btn sm" id="avbtn" type="button">Bild ändern</button><button class="btn ghost sm" id="avdel" type="button" hidden>Bild entfernen</button></div><input id="avfile" type="file" accept="image/*" hidden><p class="hint" id="avmsg" role="status">Wird quadratisch zugeschnitten. Nur du und N1CO sehen dein Bild – unpassende Bilder löscht N1CO.</p></div></div>
<div id="next"></div>
<h2 class="h2" id="moreh" style="margin:2rem 0 1rem" hidden>Weitere Turniere</h2><div id="more" class="grid"></div>
<h2 class="h2" id="pasth" style="margin:2rem 0 1rem" hidden>Vergangen</h2><div id="past" class="grid"></div>
</div></main>
<script>
const $=s=>document.querySelector(s);const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};const fmt=t=>new Date(t).toLocaleString("de-DE",{dateStyle:"full",timeStyle:"short"})+" Uhr";
let cred=JSON.parse(sessionStorage.getItem('cred')||'null');
const berlin=new Date().toLocaleString('sv-SE',{timeZone:'Europe/Berlin'}).slice(0,16).replace(' ','T');
const rel=w=>{const n=Math.round((new Date(w.slice(0,10)+'T00:00')-new Date(berlin.slice(0,10)+'T00:00'))/864e5);return new Intl.RelativeTimeFormat('de',{numeric:'auto'}).format(n,'day')};
function tCard(t,cls){
  const c=el('article',null,'card '+(cls||''));
  c.append(el('h3',t.title),el('p',t.game+' · '+rel(t.when),'role'),el('p',fmt(t.when),'when'));
  const m=el('dl',null,'meta'),mates=el('dd');
  if(t.mates.length){const ch=el('div',null,'chips');t.mates.forEach(x=>ch.append(el('span',x,'chip')));mates.append(ch)}else mates.textContent='Solo';
  m.append(el('dt','Wo'),el('dd',t.location),el('dt','Gegner'),el('dd',t.opponent||'noch offen'),el('dt','Mit dir'),mates);
  if(t.notes)m.append(el('dt','Hinweise'),el('dd',t.notes));
  c.append(m);return c;
}
async function load(extra){
  const r=await fetch('/api/player',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...cred,...extra})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Fehler');
  sessionStorage.setItem('cred',JSON.stringify(cred));$('#login').hidden=true;$('#panel').hidden=false;
  $('#hello').textContent='Hi '+j.user.toUpperCase();
  const w=$('#avwrap');w.replaceChildren();
  if(j.avatar){const i=el('img',null,'av');i.src=j.avatar;i.alt='Dein Bild';w.append(i)}else w.append(el('div',j.user[0].toUpperCase(),'av'));
  $('#avdel').hidden=!j.avatar;
  const up=j.tournaments.filter(t=>t.when>=berlin),old=j.tournaments.filter(t=>t.when<berlin).reverse();
  const n=$('#next');n.replaceChildren();
  if(up.length){const h=el('h2','Dein nächstes Turnier','h2');h.style.marginBottom='1rem';n.append(h,tCard(up[0],'next'))}
  else n.append(el('p','Aktuell ist kein Turnier für dich eingetragen. Sobald N1CO eins anlegt, siehst du es hier.','hint'));
  for(const [id,hid,list] of [['more','moreh',up.slice(1)],['past','pasth',old]]){const b=$('#'+id);b.replaceChildren(...list.map(t=>tCard(t,id==='past'?'past':'')));$('#'+hid).hidden=!list.length}
}
$('#login').addEventListener('submit',e=>{e.preventDefault();$('#lerr').textContent='';cred={user:$('#user').value,password:$('#pw').value};load().catch(x=>$('#lerr').textContent=x.message)});
$('#reload').onclick=()=>load().catch(()=>location.reload());
$('#logout').onclick=()=>{sessionStorage.removeItem('cred');location.reload()};
$('#avbtn').onclick=()=>$('#avfile').click();
$('#avfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const m=$('#avmsg');m.textContent='Wird hochgeladen …';
  try{
    const bmp=await createImageBitmap(f),s=Math.min(bmp.width,bmp.height),c=document.createElement('canvas');c.width=c.height=256;
    c.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
    await load({image:c.toDataURL('image/jpeg',.82)});m.textContent='✔ Bild gespeichert.';
  }catch(x){m.textContent='Das hat nicht geklappt: '+(x.message||'Bild konnte nicht gelesen werden.')}
};
$('#avdel').onclick=async()=>{if(confirm('Dein Bild wirklich entfernen?'))await load({image:null}).catch(()=>{})};
if(cred)load().catch(()=>sessionStorage.removeItem('cred'));
</script></body></html>
