<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nico Gaming - Gameplay (IRL)</title>
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/irl.css"><script src="assets/config.js"></script></head><body>
<div id="stage">
<div class="layer vig" style="opacity:.35"></div>
<div class="panel cut in l box l-logo" style="--d:.2s"><img src="assets/img/logo.png" style="width:64px;height:64px;filter:drop-shadow(0 0 10px var(--red))"><div><div class="orb" style="font-size:24px;font-weight:900;letter-spacing:3px">NICO GAMING</div><div class="live" style="margin-top:6px">LIVE</div></div></div>
<div class="panel in l box l-viewers" data-box="viewers" style="--d:.4s"><iframe data-widget="viewers" scrolling="no"></iframe></div>
<div class="panel cut in r box l-music" data-box="music" style="--d:.5s"><span class="tag">MUSIK</span><iframe data-widget="music" scrolling="no" style="transform:scale(1.5)"></iframe></div>
<div class="panel cut in r box l-chat" data-box="chat" style="--d:.7s"><span class="tag">CHAT</span><iframe data-widget="chat" scrolling="no" style="margin-top:20px;height:calc(100% - 20px)"></iframe></div>
<div class="panel cut in l box l-sponsor" data-box="sponsor" style="--d:.9s"><span class="tag">SPONSOR</span><iframe data-widget="sponsor" scrolling="no"></iframe></div>
<div class="cam in l box l-cam hide" data-box="cam" style="--d:1.1s"><i></i><i></i><i></i><i></i></div>
<div class="orb in l l-nico" style="--d:1.3s">NICO</div>
<div class="ticker in u" style="--d:1.4s"></div>
<div class="box l-alerts" data-box="alerts"><iframe data-widget="alerts" scrolling="no"></iframe></div>
</div>
<script src="assets/engine.js"></script>
<script>if(NICO_Q.get('cam')==='1')document.querySelector('[data-box=cam]').classList.remove('hide')</script></body></html>
